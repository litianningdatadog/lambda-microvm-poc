; Supervisord config — PID 1 inside the MicroVM container.
;
; Three programs, in descending order of autostart:
;
;   user-app        autostart=true   (the user's unchanged Flask app on 8080)
;   hook-server     autostart=true   (platform code owning port 9000)
;   datadog-agent   autostart=false  (started by hook-server on /launch)
;
; The autostart=false on datadog-agent is load-bearing: if the agent is
; running when the Firecracker snapshot is taken (after /ready returns
; 200), every cloned MicroVM inherits its auth_token and resolved
; hostname. Deferring agent start until /launch fires ensures each
; clone gets fresh identity.
;
; autorestart=unexpected on datadog-agent means supervisord will NOT
; re-launch it after hook-server's graceful `agent stop` on /terminate
; (exit code 0 → expected). It will still restart on real crashes.

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0770

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; -----------------------------------------------------------------------
; User app. Wrapped with ddtrace-run for zero-code-change APM
; auto-instrumentation. stdout+stderr redirect to /var/log/app/app.log —
; the Datadog Agent's user-app.d integration tails that file.
; -----------------------------------------------------------------------
[program:user-app]
command=ddtrace-run python3.11 /app/app.py
directory=/app
stdout_logfile=/var/log/app/app.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
# Merge stderr into stdout at the child-process level (dup2 before exec)
# rather than opening two separate fds to the same file. Prevents
# interleaving artifacts when the user app writes to both streams
# concurrently (e.g. a traceback to stderr mid-request).
redirect_stderr=true
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stopwaitsecs=10
# No `environment=` line: the user-app program inherits from supervisord,
# which inherits from entrypoint.sh → the container env. That means all
# DD_* settings from the Dockerfile (DD_SITE, DD_SERVICE, DD_ENV,
# DD_LOGS_ENABLED, etc.) and from .dd-env (DD_API_KEY) flow through to
# the user app and to ddtrace-run. If you need to pin a user-app-only
# override, add it here — but prefer Dockerfile ENV as the single
# source of truth.

; -----------------------------------------------------------------------
; Platform-owned lifecycle-hook server. Owns port 9000. Its stdout goes
; to docker logs (via supervisord's logfile=/dev/stdout) so the platform
; operator can debug it independently of user-app logs.
; -----------------------------------------------------------------------
[program:hook-server]
command=python3.11 /opt/platform/hook_server.py
directory=/opt/platform
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; -----------------------------------------------------------------------
; Datadog Agent. Dormant at container boot; started by hook-server on
; /launch and stopped gracefully by hook-server on /terminate.
; -----------------------------------------------------------------------
[program:datadog-agent]
command=/opt/datadog-agent/bin/agent/agent run
user=dd-agent
autostart=false
autorestart=unexpected
exitcodes=0
stopsignal=INT
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
